<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" width="100%" height="120">
  <style>
    .bg {
      animation: bgCycle 86400s linear -52500s infinite;
    }
    @keyframes bgCycle {
      0%,100% { fill: #080820; }
      12%     { fill: #050516; }
      21%     { fill: #0a1628; }
      29%     { fill: #1a0a00; }
      38%     { fill: #001a2e; }
      50%     { fill: #001040; }
      60%     { fill: #0d1117; }
      67%     { fill: #0a1a10; }
      75%     { fill: #1a0500; }
      83%     { fill: #0d0520; }
      92%     { fill: #08081a; }
    }
    @keyframes frontCycle {
      0%,100% { fill: #1a0533; opacity: 0.9; }
      12%     { fill: #0d0f4d; opacity: 0.9; }
      21%     { fill: #0a3d62; opacity: 0.85; }
      29%     { fill: #FF6B35; opacity: 0.9; }
      38%     { fill: #29B6F6; opacity: 0.9; }
      50%     { fill: #00E5FF; opacity: 0.9; }
      60%     { fill: #2196F3; opacity: 0.9; }
      67%     { fill: #00BFA5; opacity: 0.9; }
      75%     { fill: #FF7043; opacity: 0.9; }
      83%     { fill: #7C3AED; opacity: 0.9; }
      92%     { fill: #3949AB; opacity: 0.9; }
    }
    @keyframes midCycle {
      0%,100% { fill: #0d0221; opacity: 0.55; }
      12%     { fill: #12124a; opacity: 0.55; }
      21%     { fill: #003366; opacity: 0.5;  }
      29%     { fill: #E91E63; opacity: 0.55; }
      38%     { fill: #00BCD4; opacity: 0.55; }
      50%     { fill: #2196F3; opacity: 0.55; }
      60%     { fill: #00ACC1; opacity: 0.55; }
      67%     { fill: #1DE9B6; opacity: 0.5;  }
      75%     { fill: #E91E63; opacity: 0.55; }
      83%     { fill: #4527A0; opacity: 0.55; }
      92%     { fill: #1565C0; opacity: 0.55; }
    }
    @keyframes backCycle {
      0%,100% { fill: #120840; opacity: 0.35; }
      12%     { fill: #0a0a40; opacity: 0.35; }
      21%     { fill: #00264d; opacity: 0.3;  }
      29%     { fill: #FF8F00; opacity: 0.4;  }
      38%     { fill: #B3E5FC; opacity: 0.35; }
      50%     { fill: #81D4FA; opacity: 0.35; }
      60%     { fill: #00BCD4; opacity: 0.35; }
      67%     { fill: #A7FFEB; opacity: 0.3;  }
      75%     { fill: #FF6B35; opacity: 0.4;  }
      83%     { fill: #CE93D8; opacity: 0.35; }
      92%     { fill: #7986CB; opacity: 0.35; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="120"/>

  <!-- Wave layer 3 (back) — flipped upward -->
  <path d="M0,60 C300,10 600,100 900,40 C1050,10 1150,70 1200,60 L1200,0 L0,0 Z">
    <animate attributeName="fill"
      values="#120840;#0a0a40;#00264d;#FF8F00;#B3E5FC;#81D4FA;#00BCD4;#A7FFEB;#FF6B35;#CE93D8;#7986CB;#120840"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.35;0.3;0.4;0.35;0.35;0.35;0.3;0.4;0.35;0.35;0.35"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="d"
      values="
        M0,60 C300,10  600,100 900,40 C1050,10  1150,70 1200,60 L1200,0 L0,0 Z;
        M0,40 C300,100 600,20  900,80 C1050,110 1150,30 1200,50 L1200,0 L0,0 Z;
        M0,70 C300,20  600,90  900,30 C1050,0   1150,80 1200,40 L1200,0 L0,0 Z;
        M0,60 C300,10  600,100 900,40 C1050,10  1150,70 1200,60 L1200,0 L0,0 Z
      "
      dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Wave layer 2 (middle) -->
  <path d="M0,45 C200,90 500,20 700,70 C900,110 1100,40 1200,75 L1200,0 L0,0 Z">
    <animate attributeName="fill"
      values="#0d0221;#12124a;#003366;#E91E63;#00BCD4;#2196F3;#00ACC1;#1DE9B6;#E91E63;#4527A0;#1565C0;#0d0221"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.55;0.5;0.55;0.55;0.55;0.55;0.5;0.55;0.55;0.55;0.55"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="d"
      values="
        M0,45 C200,90  500,20  700,70 C900,110 1100,40 1200,75 L1200,0 L0,0 Z;
        M0,75 C200,20  500,90  700,30 C900,0   1100,80 1200,40 L1200,0 L0,0 Z;
        M0,55 C200,100 500,30  700,80 C900,110 1100,20 1200,65 L1200,0 L0,0 Z;
        M0,45 C200,90  500,20  700,70 C900,110 1100,40 1200,75 L1200,0 L0,0 Z
      "
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Wave layer 1 (front) -->
  <path d="M0,35 C150,70 400,10 600,50 C800,90 1050,25 1200,55 L1200,0 L0,0 Z">
    <animate attributeName="fill"
      values="#1a0533;#0d0f4d;#0a3d62;#FF6B35;#29B6F6;#00E5FF;#2196F3;#00BFA5;#FF7043;#7C3AED;#3949AB;#1a0533"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.9;0.85;0.9;0.9;0.9;0.9;0.9;0.9;0.9;0.9;0.9"
      keyTimes="0;0.12;0.21;0.29;0.38;0.5;0.60;0.67;0.75;0.83;0.92;1"
      dur="86400s" begin="-52500s" repeatCount="indefinite"/>
    <animate attributeName="d"
      values="
        M0,35 C150,70  400,10  600,50 C800,90  1050,25 1200,55 L1200,0 L0,0 Z;
        M0,55 C150,20  400,80  600,30 C800,0   1050,65 1200,30 L1200,0 L0,0 Z;
        M0,30 C150,60  400,20  600,70 C800,100 1050,35 1200,65 L1200,0 L0,0 Z;
        M0,35 C150,70  400,10  600,50 C800,90  1050,25 1200,55 L1200,0 L0,0 Z
      "
      dur="5s" repeatCount="indefinite"/>
  </path>

</svg>
