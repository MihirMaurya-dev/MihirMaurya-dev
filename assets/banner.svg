<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient: Deep Obsidian Purple to Void Black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0517"/>
      <stop offset="45%" stop-color="#140728"/>
      <stop offset="85%" stop-color="#080313"/>
      <stop offset="100%" stop-color="#020005"/>
    </linearGradient>

    <!-- Matrix Neon Green to Cyber Cyan Gradient -->
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>

    <!-- Obsidian Purple Glow Gradient -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9D4EDD" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#00FF66" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes circuitScan {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
      transform-origin: 1040px 48px;
    }
    .scan-line {
      stroke-dasharray: 80 320;
      animation: circuitScan 6s linear infinite;
    }
    .mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#cyberGrid)"/>

  <!-- Outer Border with Deep Obsidian Purple Hue -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#7B2CBF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top Accent Glowing Bar -->
  <path d="M 30 1 L 1170 1" stroke="url(#matrixGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#matrixGlow)"/>

  <!-- Circuit Network Lines -->
  <g opacity="0.45">
    <path d="M 80 320 L 80 260 L 160 210 L 320 210" fill="none" stroke="#9D4EDD" stroke-width="1.2" class="scan-line"/>
    <path d="M 1120 320 L 1120 240 L 1020 180 L 850 180" fill="none" stroke="#00FF66" stroke-width="1.2" class="scan-line"/>
    <circle cx="320" cy="210" r="3" fill="#9D4EDD"/>
    <circle cx="850" cy="180" r="3" fill="#00FF66"/>
  </g>

  <!-- Status HUD Capsule (Top Right) -->
  <g transform="translate(860, 32)">
    <rect width="300" height="34" rx="17" fill="#180B30" stroke="#00FF66" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="17" r="5" fill="#00FF66" filter="url(#matrixGlow)" class="pulse"/>
    <text x="36" y="22" fill="#00FF66" class="mono" font-size="11" font-weight="700" letter-spacing="1">CONTROL PLANE: ONLINE</text>
    <text x="220" y="22" fill="#9D4EDD" class="mono" font-size="11" font-weight="600">v3.8-SEC</text>
  </g>

  <!-- Terminal Prefix Tag -->
  <g transform="translate(60, 48)">
    <rect width="180" height="24" rx="6" fill="#1D0E3A" stroke="#7B2CBF" stroke-opacity="0.5"/>
    <text x="12" y="16" fill="#00E5FF" class="mono" font-size="11" font-weight="600" letter-spacing="1.2">&gt; SRE_SYS_INIT_OK</text>
  </g>

  <!-- Primary Headline: Name & Identity -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" fill="#FFFFFF" class="sans" font-size="46" font-weight="900" letter-spacing="-0.5">MIHIR MAURYA</text>
    <text x="365" y="-6" fill="#00FF66" class="mono" font-size="14" font-weight="700" letter-spacing="2" filter="url(#matrixGlow)">[ARCHITECT]</text>
  </g>

  <!-- Subtitle: Specializations -->
  <g transform="translate(60, 165)">
    <text x="0" y="0" fill="#C4B5FD" class="sans" font-size="19" font-weight="600" letter-spacing="0.2">
      Cloud Solutions Architect <tspan fill="#00E5FF">·</tspan> Enterprise DevSecOps <tspan fill="#00E5FF">·</tspan> Agentic AI Systems
    </text>
  </g>

  <!-- Tagline / Architecture Philosophy -->
  <g transform="translate(60, 202)">
    <text x="0" y="0" fill="#94A3B8" class="mono" font-size="13" font-weight="400" letter-spacing="0.5">
      Automating Azure Landing Zones (CAF) · Shift-Left CI/CD Governance · Autonomous SRE Swarms
    </text>
  </g>

  <!-- Bottom Capability Badges -->
  <g transform="translate(60, 240)">
    <!-- Badge 1: Azure CAF 3.0 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="8" fill="#14092A" stroke="#7B2CBF" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="4" fill="#0078D4"/>
      <text x="32" y="24" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">Azure CAF Hub-Spoke</text>
    </g>

    <!-- Badge 2: Zero-Trust OIDC CI/CD -->
    <g transform="translate(225, 0)">
      <rect width="220" height="38" rx="8" fill="#14092A" stroke="#00FF66" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="4" fill="#00FF66"/>
      <text x="32" y="24" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">OIDC Secretless CI/CD</text>
    </g>

    <!-- Badge 3: MCP Agent Swarms -->
    <g transform="translate(460, 0)">
      <rect width="240" height="38" rx="8" fill="#14092A" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="4" fill="#00E5FF"/>
      <text x="32" y="24" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">Agentic AI (MCP &amp; Swarms)</text>
    </g>

    <!-- Badge 4: 174+ Vault Runbooks -->
    <g transform="translate(715, 0)">
      <rect width="225" height="38" rx="8" fill="#14092A" stroke="#A855F7" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="4" fill="#A855F7"/>
      <text x="32" y="24" fill="#F1F5F9" class="mono" font-size="11" font-weight="600">174+ Obsidian Vault Notes</text>
    </g>
  </g>

  <!-- Matrix Hex Decorator (Bottom Right) -->
  <g transform="translate(1080, 240)" opacity="0.3">
    <polygon points="20,0 40,11 40,33 20,44 0,33 0,11" fill="none" stroke="#00FF66" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="3" fill="#00FF66"/>
  </g>
</svg>
