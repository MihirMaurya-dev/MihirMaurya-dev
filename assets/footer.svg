<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="140">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07030e"/>
      <stop offset="50%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>

    <linearGradient id="footerMatrix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="30%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>

    <filter id="fglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="footerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#9D4EDD" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseHeartbeat {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .heartbeat {
      animation: pulseHeartbeat 2s ease-in-out infinite;
    }
    .mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    }
  </style>

  <rect width="1200" height="140" rx="12" fill="url(#footerBg)"/>
  <rect width="1200" height="140" rx="12" fill="url(#footerGrid)"/>
  <rect width="1198" height="138" x="1" y="1" rx="11" fill="none" stroke="#7B2CBF" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Top Matrix Line -->
  <path d="M 20 1 L 1180 1" stroke="url(#footerMatrix)" stroke-width="2" filter="url(#fglow)"/>

  <!-- Status Light & Left Text -->
  <g transform="translate(40, 42)">
    <circle cx="10" cy="10" r="4.5" fill="#00FF66" class="heartbeat" filter="url(#fglow)"/>
    <text x="24" y="14" fill="#00FF66" class="mono" font-size="12" font-weight="700" letter-spacing="1.2">SYSTEM OPERATIONAL</text>
    <text x="200" y="14" fill="#64748B" class="mono" font-size="12">|</text>
    <text x="218" y="14" fill="#C4B5FD" class="mono" font-size="12" font-weight="500">Mihir Maurya Cloud &amp; DevSecOps Infrastructure</text>
  </g>

  <!-- Middle Telemetry Pills -->
  <g transform="translate(40, 85)">
    <!-- Pill 1 -->
    <rect width="190" height="28" rx="6" fill="#140728" stroke="#7B2CBF" stroke-width="1"/>
    <text x="12" y="18" fill="#A855F7" class="mono" font-size="10.5" font-weight="600">CAF 3.0: COMPLIANT</text>

    <!-- Pill 2 -->
    <g transform="translate(205, 0)">
      <rect width="210" height="28" rx="6" fill="#051c14" stroke="#00FF66" stroke-opacity="0.6" stroke-width="1"/>
      <text x="12" y="18" fill="#00FF66" class="mono" font-size="10.5" font-weight="600">ZERO-TRUST: ENFORCED</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(430, 0)">
      <rect width="220" height="28" rx="6" fill="#08182b" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1"/>
      <text x="12" y="18" fill="#00E5FF" class="mono" font-size="10.5" font-weight="600">OIDC AUTH: SECRETLESS</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(665, 0)">
      <rect width="220" height="28" rx="6" fill="#18072b" stroke="#C084FC" stroke-opacity="0.6" stroke-width="1"/>
      <text x="12" y="18" fill="#E9D5FF" class="mono" font-size="10.5" font-weight="600">VAULT: 174+ KNOWLEDGE</text>
    </g>
  </g>

  <!-- Right Side Hash / Signature -->
  <g transform="translate(980, 52)">
    <text x="0" y="0" fill="#64748B" class="mono" font-size="11">NODE ID: AZ-CENTRAL</text>
    <text x="0" y="20" fill="#00FF66" class="mono" font-size="11" font-weight="700">HASH: 0x9D4E...SEC</text>
  </g>
</svg>
